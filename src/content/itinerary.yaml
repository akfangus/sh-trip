# 일정표: 사용자 원본(2026-11-04)을 오전/오후/저녁으로 다시 묶었다. 시간은 모두 JST.
# period: morning(오전) / afternoon(오후) / evening(저녁)
# kind: place(가는 곳) / meal(먹는 것) / move(큰 이동)
# status: reserved(예약 확정, 시각 표시) / fixed(비행기·하루카, 시각 표시) / planned(시각 없음)
# landmark: src/content/landmarks/<id>.md 를 참조하면 해설로 연결되고 "가는 곳"이 된다.

- id: day1
  day: 1
  date: "2026-11-05"
  title: 교토에 도착해요
  items:
    - period: afternoon
      kind: move
      status: fixed
      time: "14:10"
      title: 인천공항 출발
    - period: afternoon
      kind: move
      status: fixed
      time: "16:00"
      title: 간사이공항 도착
      detail: 입국심사와 짐 찾기
    - period: evening
      kind: move
      status: planned
      title: 하루카 타고 교토로, 숙소 체크인
      note: 열차 시각은 공항에서 정해요
    - period: evening
      kind: meal
      status: reserved
      time: "19:30"
      title: 우메코지 카덴쇼 가이세키
      detail: 숙소에서 먹는 교토 코스 요리
